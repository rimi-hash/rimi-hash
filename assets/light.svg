<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" width="100%" height="100%">
  <defs>
    <!-- Font Import and CSS Styles -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&amp;family=Outfit:wght@400;500;600;800&amp;display=swap');
      
      .title-text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: url(#name-gradient-light);
      }
      .subtitle-text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        font-size: 21px;
        fill: #0F172A;
      }
      .label-text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #0284C7;
        letter-spacing: 2.5px;
      }
      .body-text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 400;
        font-size: 13.5px;
        fill: #475569;
      }
      .code-text {
        font-family: 'Fira Code', 'Courier New', Courier, monospace;
        font-size: 10.5px;
        font-weight: 400;
      }
      .badge-text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 500;
        font-size: 11px;
        fill: #334155;
        dominant-baseline: middle;
      }
      
      /* Subtle CSS animations */
      @keyframes pulse {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.05); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      .animated-bg-1 {
        animation: pulse 8s ease-in-out infinite;
        transform-origin: 750px 100px;
      }
      .animated-bg-2 {
        animation: pulse 12s ease-in-out infinite;
        transform-origin: 100px 280px;
      }
      .animated-window {
        animation: float 6s ease-in-out infinite;
      }
      .cursor {
        animation: blink 1s step-end infinite;
        fill: #0284C7;
      }
      .badge-pill:hover {
        stroke: #0284C7;
        fill: #F1F5F9;
        cursor: pointer;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="bg-gradient-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    
    <linearGradient id="name-gradient-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <linearGradient id="ide-gradient-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.98" />
    </linearGradient>
    
    <linearGradient id="glow-gradient-1-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#4ADE80" stop-opacity="0.01" />
    </linearGradient>
    
    <linearGradient id="glow-gradient-2-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.01" />
    </linearGradient>

    <!-- Patterns -->
    <pattern id="grid-light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>
    <pattern id="dots-light" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#94A3B8" fill-opacity="0.3" />
    </pattern>

    <!-- Filters for Shadows -->
    <filter id="shadow-light" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#64748B" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg-gradient-light)" />
  <rect width="100%" height="100%" fill="url(#grid-light)" />
  <rect width="100%" height="100%" fill="url(#dots-light)" />
  
  <!-- Glowing Background Blurs -->
  <circle cx="750" cy="100" r="180" fill="url(#glow-gradient-1-light)" filter="blur(45px)" class="animated-bg-1" />
  <circle cx="120" cy="260" r="140" fill="url(#glow-gradient-2-light)" filter="blur(40px)" class="animated-bg-2" />

  <!-- ========================================================= -->
  <!-- LEFT COLUMN - PROFILE DETAILS                             -->
  <!-- ========================================================= -->
  
  <!-- Developer Greeting -->
  <text x="50" y="65" class="label-text">HELLO WORLD, I'M</text>
  
  <!-- Name -->
  <text x="50" y="110" class="title-text">RITHISH S.</text>
  
  <!-- Subtitle / Dev Identity -->
  <text x="50" y="145" class="subtitle-text">Java Backend Developer</text>
  
  <!-- Bullet Points / Description -->
  <g transform="translate(50, 168)">
    <!-- Bullet 1 -->
    <circle cx="6" cy="10" r="3" fill="#0284C7" />
    <text x="20" y="14" class="body-text">B.E. Computer Science &amp; Engineering student</text>
    
    <!-- Bullet 2 -->
    <circle cx="6" cy="30" r="3" fill="#16A34A" />
    <text x="20" y="34" class="body-text">Specializing in Spring Boot, REST APIs &amp; Databases</text>
    
    <!-- Bullet 3 -->
    <circle cx="6" cy="50" r="3" fill="#16A34A" />
    <text x="20" y="54" class="body-text">Focused on scalable architectures &amp; cloud deployment</text>
  </g>

  <!-- ========================================================= -->
  <!-- TECHNOLOGY BADGES (Interactive Pills)                     -->
  <!-- ========================================================= -->
  <g transform="translate(0, 12)">
    <!-- ROW 1 -->
    <!-- Java Badge -->
    <g transform="translate(50, 245)" class="badge-pill">
      <rect width="65" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <g transform="translate(8, 4)" stroke="#0284C7" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <path d="M2 5 h10 v6 a3 3 0 0 1 -3 3 H5 a3 3 0 0 1 -3 -3 z" />
        <path d="M12 7 h1 a2 2 0 0 1 2 2 v0 a2 2 0 0 1 -2 2 h-1" />
        <path d="M4 2 v1 M7 1 v2 M10 2 v1" />
        <path d="M1 15 h12" />
      </g>
      <text x="28" y="12" class="badge-text">Java</text>
    </g>

    <!-- Spring Boot Badge -->
    <g transform="translate(122, 245)" class="badge-pill">
      <rect width="105" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <g transform="translate(8, 4)" stroke="#16A34A" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <path d="M8 15 C8 15 15 11 15 5 C15 5 10 3 6 7 C2 11 5 15 8 15 Z" />
        <path d="M3 13 C7 10 11 8 15 5" />
        <path d="M8 15 v1" />
      </g>
      <text x="28" y="12" class="badge-text">Spring Boot</text>
    </g>

    <!-- MySQL Badge -->
    <g transform="translate(234, 245)" class="badge-pill">
      <rect width="78" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <g transform="translate(8, 4)" stroke="#0284C7" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <ellipse cx="8" cy="4" rx="5" ry="2" />
        <path d="M3 4 v4 c0 1.1 2.2 2 5 2 s5 -.9 5 -2 v-4" />
        <path d="M3 8 v4 c0 1.1 2.2 2 5 2 s5 -.9 5 -2 v-4" />
      </g>
      <text x="28" y="12" class="badge-text">MySQL</text>
    </g>

    <!-- Docker Badge -->
    <g transform="translate(319, 245)" class="badge-pill">
      <rect width="80" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <g transform="translate(8, 4)" stroke="#0284C7" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <rect x="2" y="9" width="12" height="5" rx="1" />
        <rect x="3" y="4" width="4" height="4" rx="0.5" />
        <rect x="9" y="4" width="4" height="4" rx="0.5" />
      </g>
      <text x="28" y="12" class="badge-text">Docker</text>
    </g>

    <!-- ROW 2 -->
    <!-- AWS Badge -->
    <g transform="translate(50, 277)" class="badge-pill">
      <rect width="65" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <g transform="translate(8, 4)" stroke="#EA580C" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <path d="M4 12 a3 3 0 0 1 1 -5.8 a4.5 4.5 0 0 1 8.5 1.3 a3 3 0 0 1 0.5 5.5 z" />
      </g>
      <text x="28" y="12" class="badge-text">AWS</text>
    </g>

    <!-- Git Badge -->
    <g transform="translate(122, 277)" class="badge-pill">
      <rect width="60" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <g transform="translate(8, 4)" stroke="#EA4335" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <circle cx="5" cy="4" r="1.5" fill="#EA4335" />
        <circle cx="5" cy="12" r="1.5" fill="#EA4335" />
        <circle cx="11" cy="8" r="1.5" fill="#EA4335" />
        <path d="M5 5.5 v5" />
        <path d="M5 8.5 c2 0 4 0 6 -0.5" />
      </g>
      <text x="28" y="12" class="badge-text">Git</text>
    </g>

    <!-- Maven Badge -->
    <g transform="translate(189, 277)" class="badge-pill">
      <rect width="78" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <g transform="translate(8, 4)" stroke="#991B1B" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <path d="M2 13 V3 l4 5 l4 -5 v10" />
        <circle cx="8" cy="13" r="1" fill="#991B1B" />
      </g>
      <text x="28" y="12" class="badge-text">Maven</text>
    </g>

    <!-- Postman Badge -->
    <g transform="translate(274, 277)" class="badge-pill">
      <rect width="88" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <g transform="translate(8, 4)" stroke="#EF5B25" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <path d="M8 2 C8 2 12 5 12 9 C12 12 10 14 8 14 C6 14 4 12 4 9 C4 5 8 2 8 2 Z" />
        <path d="M6 14 l-1.5 2 M10 14 l1.5 2" />
        <circle cx="8" cy="8" r="1.5" />
      </g>
      <text x="28" y="12" class="badge-text">Postman</text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT COLUMN - IDE MOCKUP WINDOW                          -->
  <!-- ========================================================= -->
  
  <g transform="translate(435, 45)" class="animated-window" filter="url(#shadow-light)">
    <!-- Window Body -->
    <rect width="365" height="260" rx="8" fill="url(#ide-gradient-light)" stroke="#E2E8F0" stroke-width="1.2" />
    
    <!-- Title Bar Header -->
    <rect width="365" height="35" rx="8" fill="#F1F5F9" />
    <line x1="0" y1="35" x2="365" y2="35" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- MacOS Style Window Controls -->
    <circle cx="16" cy="18" r="5" fill="#FF5F56" />
    <circle cx="32" cy="18" r="5" fill="#FFBD2E" />
    <circle cx="48" cy="18" r="5" fill="#27C93F" />
    
    <!-- Editor Tab -->
    <g transform="translate(75, 8)">
      <rect width="165" height="27" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <!-- Java Cup inside tab -->
      <path d="M12 6c-.5 0-.8.3-.8.8v.5c0 .3.1.6.3.8-.3.3-.5.7-.5 1.1s.2.8.5 1.1c-.2.2-.3.5-.3.8 0 .5.3.8.8.8h3c.5 0 .8-.3.8-.8 0-.3-.1-.6-.3-.8.3-.3.5-.7.5-1.1s-.2-.8-.5-1.1c.2-.2.3-.5.3-.8 0-.5-.3-.8-.8-.8h-3z" fill="#D97706" transform="translate(4, 2)" />
      <text x="22" y="16" font-family="'Outfit', sans-serif" font-size="11" font-weight="500" fill="#475569">DeveloperController.java</text>
    </g>

    <!-- Syntax Highlighted Code (Light Theme) -->
    <g class="code-text" transform="translate(18, 48)">
      <!-- Line 1: Annotation -->
      <text x="0" y="15"><tspan fill="#9333EA">@RestController</tspan></text>
      
      <!-- Line 2: Request Mapping -->
      <text x="0" y="30"><tspan fill="#9333EA">@RequestMapping</tspan><tspan fill="#334155">(</tspan><tspan fill="#16A34A">"/api/v1/dev"</tspan><tspan fill="#334155">)</tspan></text>
      
      <!-- Line 3: Class Declaration -->
      <text x="0" y="45"><tspan fill="#D73A49">public class</tspan><tspan fill="#0284C7"> RithishController </tspan><tspan fill="#334155">{</tspan></text>
      
      <!-- Line 4: GetMapping -->
      <text x="15" y="60"><tspan fill="#9333EA">@GetMapping</tspan><tspan fill="#334155">(</tspan><tspan fill="#16A34A">"/profile"</tspan><tspan fill="#334155">)</tspan></text>
      
      <!-- Line 5: Method Declaration -->
      <text x="15" y="75"><tspan fill="#D73A49">public</tspan><tspan fill="#005CC5"> Profile</tspan><tspan fill="#0284C7"> getProfile</tspan><tspan fill="#334155">() {</tspan></text>
      
      <!-- Line 6: Return Builder -->
      <text x="30" y="90"><tspan fill="#D73A49">return</tspan><tspan fill="#0284C7"> Profile</tspan><tspan fill="#334155">.builder()</tspan></text>
      
      <!-- Line 7: Builder Field Name -->
      <text x="45" y="105"><tspan fill="#334155">.name(</tspan><tspan fill="#16A34A">"Rithish S."</tspan><tspan fill="#334155">)</tspan></text>
      
      <!-- Line 8: Builder Field Role -->
      <text x="45" y="120"><tspan fill="#334155">.role(</tspan><tspan fill="#16A34A">"Java Backend Developer"</tspan><tspan fill="#334155">)</tspan></text>
      
      <!-- Line 9: Builder Field Stack -->
      <text x="45" y="135"><tspan fill="#334155">.stack(</tspan><tspan fill="#16A34A">"Spring Boot &amp; AWS"</tspan><tspan fill="#334155">)</tspan></text>
      
      <!-- Line 10: Builder Build Method -->
      <text x="45" y="150"><tspan fill="#334155">.build();</tspan></text>
      
      <!-- Line 11: Method Closing Bracket -->
      <text x="15" y="165"><tspan fill="#334155">}</tspan></text>
      
      <!-- Line 12: Class Closing Bracket & Animated Cursor -->
      <text x="0" y="180"><tspan fill="#334155">}</tspan><rect x="12" y="169" width="6" height="12" class="cursor" /></text>
    </g>
  </g>
</svg>
